services:
  app:
    container_name: ${APP_NAME:?APP_NAME must be set}
    image: ${IMAGE:?IMAGE must be set}
    restart: unless-stopped
    pull_policy: missing
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    ports:
      - "${HOST_PORT:?HOST_PORT must be set}:8080"
